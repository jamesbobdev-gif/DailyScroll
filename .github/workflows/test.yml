# Runs the unit tests and the TypeScript check on every push and pull request, so a change that breaks the
# service, the companion, the desktop user agent or the phone app's types is caught before it is merged.
#
# Supply chain: every action is pinned to a commit SHA (the version is in the trailing comment), and the job
# can only read this repository.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
