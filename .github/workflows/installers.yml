name: Build preview installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run build -- --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $installer = Get-ChildItem desktop/dist/Daily-Scroll-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii desktop/dist/WINDOWS-SHA256.txt
          gh release upload $env:RELEASE_TAG $installer.FullName desktop/dist/WINDOWS-SHA256.txt --clobber

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Disable debug signing for release
        run: node scripts/android-signing.mjs
      - name: Build unsigned APK for local signing
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: Prepare local signing tools
        run: |
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          mkdir -p local-signing
          cp "$apk" local-signing/
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)
          test -s "$signer"
          cp "$signer" local-signing/
          sha256sum local-signing/* > local-signing/BUILD-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-for-local-signing
          path: local-signing/
          retention-days: 7
